name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  milestone-zero:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run check:public
      - run: npm test
      - run: npm run build:bundle
      - name: Inspect runner vault availability
        shell: pwsh
        timeout-minutes: 2
        run: |
          $lvProbeTimer = [Diagnostics.Stopwatch]::StartNew()
          '{"operation":"probe"}' | & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/credential-vault.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Credential probe process failed' }
          Write-Output "Vault probe duration: $($lvProbeTimer.Elapsed.TotalSeconds) seconds"
      - run: npm run test:smoke
      - run: node scripts/tauri.mjs build --bundles nsis
      - name: Stage Windows preview
        shell: pwsh
        run: |
          $lvStage = Join-Path $env:RUNNER_TEMP 'lv999-ci'
          New-Item -ItemType Directory -Force -Path "$lvStage/portable", "$lvStage/installer" | Out-Null
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/target/release/lv999-desktop.exe' -Destination "$lvStage/portable/lv999-desktop.exe"
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/runtime' -Destination "$lvStage/portable/runtime" -Recurse
          Get-ChildItem -LiteralPath 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "$lvStage/installer"
          }
          $lvCommit = git rev-parse HEAD
          @{ commit = $lvCommit; run_id = $env:GITHUB_RUN_ID; platform = 'windows-x64'; preview = $true } |
            ConvertTo-Json | Set-Content -LiteralPath "$lvStage/build-info.json" -Encoding utf8NoBOM
          $lvHashes = Get-ChildItem -LiteralPath $lvStage -Recurse -File | ForEach-Object {
            $lvRelative = [IO.Path]::GetRelativePath($lvStage, $_.FullName).Replace('\', '/')
            "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $lvRelative"
          }
          $lvHashes | Set-Content -LiteralPath "$lvStage/SHA256SUMS.txt" -Encoding utf8NoBOM
      - name: Build update acceptance bootstrap
        if: github.head_ref == 'codex/updates-autostart'
        shell: pwsh
        run: |
          node scripts/tauri.mjs build --bundles nsis --config src-tauri/tauri.bootstrap.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Update bootstrap build failed' }
          $lvStage = Join-Path $env:RUNNER_TEMP 'lv999-ci'
          New-Item -ItemType Directory -Force -Path "$lvStage/bootstrap" | Out-Null
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/target/release/bundle/nsis/LV999_0.1.9_x64-setup.exe' -Destination "$lvStage/bootstrap"
          $lvHashes = Get-ChildItem -LiteralPath $lvStage -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $lvRelative = [IO.Path]::GetRelativePath($lvStage, $_.FullName).Replace('\', '/')
            "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $lvRelative"
          }
          $lvHashes | Set-Content -LiteralPath "$lvStage/SHA256SUMS.txt" -Encoding utf8NoBOM
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: LV999-windows-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/lv999-ci/
          if-no-files-found: error
          retention-days: 7
